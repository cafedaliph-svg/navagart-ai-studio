[package]
name = "navagart-ai-studio"
version = "0.1.0"
description = "Navagart AI Studio desktop application"
authors = ["Navagart"]
edition = "2021"

[lib]
name = "navagart_ai_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
